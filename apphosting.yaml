# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure#apphosting-yaml
#
# Non-sensitive env vars with explicit values are set here.
# Sensitive values (API keys) must be set in Firebase Console → App Hosting → Backend → Environment Variables
# since they should not be stored in the yaml file.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: camdiag-c7e78.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_PROJECT_ID
    value: camdiag-c7e78
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: camdiag-c7e78.appspot.com
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_GOOGLE_AI_MODEL
    value: gemini-2.0-flash
    availability:
      - BUILD
      - RUNTIME

  # ─── Sensitive keys — set in Firebase Console App Hosting backend settings ───
  # Firebase Console → App Hosting → your backend → Environment Variables
  # VITE_FIREBASE_API_KEY
  # VITE_FIREBASE_MESSAGING_SENDER_ID
  # VITE_FIREBASE_APP_ID
  # VITE_FIREBASE_MEASUREMENT_ID
  # VITE_GOOGLE_AI_API_KEY
