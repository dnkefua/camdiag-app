# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure#apphosting-yaml
#
# Non-sensitive env vars with explicit values are set here.
# Sensitive values (API keys) must be set in Firebase Console → App Hosting → Backend → Environment Variables.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80

scripts:
  buildCommand: npm run build
  runCommand: node server.js

outputFiles:
  public: dist

env:
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyDeMKB-ePfx5ojM3489WzsVTo8v1rh8muQ
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: camdiag-c7e78.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_PROJECT_ID
    value: camdiag-c7e78
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: camdiag-c7e78.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "781571839717"
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_APP_ID
