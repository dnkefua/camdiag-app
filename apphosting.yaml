# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 100

env:
  - variable: VITE_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: camdiag-c7e78.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_PROJECT_ID
    value: camdiag-c7e78
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: camdiag-c7e78.appspot.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_GOOGLE_AI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_GOOGLE_AI_MODEL
    value: gemini-2.0-flash
    availability:
      - BUILD
      - RUNTIME
