# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure#apphosting-yaml
#
# Non-sensitive env vars with explicit values are set here.
# Sensitive values (API keys) must be set in Firebase Console → App Hosting → Backend → Environment Variables.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80

scripts:
  buildCommand: npm run build
  runCommand: node server.js

outputFiles:
  public: dist

env:
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: camdiag-c7e78.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_PROJECT_ID
    value: camdiag-c7e78
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: camdiag-c7e78.appspot.com
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_GOOGLE_AI_MODEL
    value: gemini-2.0-flash
    availability:
      - BUILD
      - RUNTIME

  # Browser-restricted Maps key (HTTP referrer locked to *.camdiag-c7e78.web.app
  # and *.firebaseapp.com via Google Cloud → APIs → Credentials). Safe to commit
  # because the security boundary is the referrer check, not key secrecy.
  - variable: VITE_GOOGLE_MAPS_API_KEY
    value: AIzaSyCbdxxdZUo8CvWbo2ssR5wA_dtjokuXQ9Q
    availability:
      - BUILD
      - RUNTIME

  # ─── Sensitive keys — set in Firebase Console App Hosting backend settings ───
  # Firebase Console → App Hosting → your backend → Environment Variables
  # VITE_FIREBASE_API_KEY
  # VITE_FIREBASE_MESSAGING_SENDER_ID
  # VITE_FIREBASE_APP_ID
  # VITE_FIREBASE_MEASUREMENT_ID
  # VITE_GOOGLE_AI_API_KEY
